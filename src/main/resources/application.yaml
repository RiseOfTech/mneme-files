spring:
  application:
    name: mneme-files
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-public-key.pem}

server:
  port: 8333
  tomcat:
    max-swallow-size: 10MB

mneme:
  files:
    storage:
      endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
      bucket: ${STORAGE_BUCKET:mneme-files}
      region: ${STORAGE_REGION:us-east-1}
      access-key: ${STORAGE_ACCESS_KEY:test}
      secret-key: ${STORAGE_SECRET_KEY:test}
    upload:
      max-size: 5MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/webp
  security:
    jwt:
      issuer: ${JWT_ISSUER:mneme-auth}
